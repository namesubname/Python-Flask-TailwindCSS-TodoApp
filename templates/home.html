
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen">

    <header class="bg-white border-b border-slate-200 px-4 py-3 flex justify-between items-center sticky top-0 z-50 shadow-sm">
        <div class="w-full flex items-center justify-between gap-3">
          <div class="flex flex-row items-center justify-between gap-3">
            <div class="w-10 h-10 rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold text-lg shadow-sm">
                {{ user_initials | default('U') }}
            </div>
            <div class="hidden sm:block">
                <p class="text-sm font-semibold text-slate-700 leading-tight">{{ username | default('Пользователь') }}</p>
                <p class="text-xs text-slate-400">Личный кабинет</p>
            </div>
          </div>


            <div>
              <a href="/logout" class="text-sm font-semibold text-slate-700 leading-tight" onclick="return confirm('Вы уверены, что хотите выйти?')">Выйти</a>
            </div>
        </div>

    </header>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <main class="max-w-2xl mx-auto px-4 py-8">
        
        <!-- Заголовок страницы -->
        <div class="flex items-center justify-between mb-8">
            <div>
                <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Мой день</h1>
                <p class="text-sm text-slate-500 mt-1">Ваши задачи на день</p>
            </div>
            <span class="bg-indigo-50 text-indigo-700 text-xs font-bold px-3 py-1.5 rounded-full border border-indigo-100">
                Сегодня
            </span>
        </div>

        <!-- Форма добавления задачи -->
        <form action="/add-todo" method="POST" class="mb-8">
            <div class="flex gap-2 p-1.5 bg-white border border-slate-200 rounded-xl shadow-sm focus-within:border-indigo-500 focus-within:ring-2 focus-within:ring-indigo-100 transition-all">
                <input type="text" name="title" placeholder="Добавить новую задачу..." required
                    class="w-full px-3 py-2 text-slate-700 bg-transparent placeholder-slate-400 focus:outline-none text-base">
                <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2 rounded-lg flex items-center gap-1 transition-colors text-sm shrink-0">
                    <span>Добавить</span>
                </button>
            </div>
        </form>

        <!-- СПИСОК ЗАДАЧ -->
        <div class="space-y-3">
            {% for task in active %}
            <div class="flex items-start justify-between p-4 bg-white border border-slate-200 rounded-xl shadow-sm hover:shadow-md transition-shadow gap-3">
                <div class="flex items-start gap-3 min-w-0 flex-1">
                   <a href="/toggle/{{ task.id }}" class="w-6 h-6 rounded-full border-2 border-slate-300 flex items-center justify-center text-transparent hover:border-indigo-500 hover:text-indigo-500 hover:bg-indigo-50 transition-all shrink-0 mt-0.5">
                        <i data-lucide="check" class="w-4 h-4 block"></i>
                    </a>
                    <span class="text-slate-700 font-medium text-base break-words whitespace-normal leading-relaxed">
                        {{ task.title }}
                    </span>
                </div>
                <a href="/delete/{{ task.id }}" class="p-1.5 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors shrink-0 flex items-center justify-center" aria-label="Удалить">
                    <i data-lucide="trash-2" class="w-5 h-5 block"></i>
                </a>
            </div>
            {% endfor %}

            {% for task in completed %}
            <div class="flex items-start justify-between p-4 bg-slate-50/50 border border-slate-200/60 rounded-xl opacity-60 gap-3">
                <div class="flex items-start gap-3 min-w-0 flex-1">
                    <a href="/toggle/{{ task.id }}" class="w-6 h-6 rounded-full bg-emerald-500 text-white flex items-center justify-center border-2 border-emerald-500 shadow-sm shadow-emerald-100 shrink-0 mt-0.5 hover:bg-indigo-50 hover:border-indigo-500 hover:text-indigo-500 transition-all duration-200">
                        <i data-lucide="check" class="w-4 h-4 block"></i>
                    </a>
                    <span class="text-slate-500 line-through text-base break-words whitespace-normal leading-relaxed">
                        {{ task.title }}
                    </span>
                </div>
                <a href="/delete/{{ task.id }}" class="p-1.5 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors shrink-0 flex items-center justify-center" aria-label="Удалить">
                    <i data-lucide="trash-2" class="w-5 h-5 block"></i>
                </a>
            </div>
            {% endfor %}
        </div>

    </main>

</body>
</html>
